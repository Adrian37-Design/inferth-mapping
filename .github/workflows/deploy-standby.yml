# Builds the app image on every push to main and deploys it to the standby
# VPS. This runs on GitHub's infrastructure, so it keeps working even when
# Railway's build/deploy pipeline is down. Railway itself still deploys from
# its own GitHub integration as usual — this workflow is the fallback path.
#
# Required repo secrets (Settings -> Secrets -> Actions):
#   STANDBY_HOST     - standby VPS IP or hostname
#   STANDBY_USER     - SSH user (e.g. root or deploy)
#   STANDBY_SSH_KEY  - private key authorised on the VPS
#   STANDBY_PORT     - optional, defaults to 22
# Until STANDBY_HOST is set the image is still built and pushed to GHCR,
# so the package registry always has a deployable image ready.

name: Deploy standby

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/adrian37-design/inferth-mapping

jobs:
  standby:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to standby VPS
        env:
          STANDBY_HOST: ${{ secrets.STANDBY_HOST }}
          STANDBY_USER: ${{ secrets.STANDBY_USER }}
          STANDBY_SSH_KEY: ${{ secrets.STANDBY_SSH_KEY }}
          STANDBY_PORT: ${{ secrets.STANDBY_PORT }}
        run: |
          if [ -z "$STANDBY_HOST" ]; then
            echo "Standby not configured (STANDBY_HOST unset) — image pushed to GHCR only."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STANDBY_SSH_KEY" > ~/.ssh/standby_key
          chmod 600 ~/.ssh/standby_key
          ssh-keyscan -p "${STANDBY_PORT:-22}" -H "$STANDBY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/standby_key -p "${STANDBY_PORT:-22}" "$STANDBY_USER@$STANDBY_HOST" '
            set -e
            cd /opt/inferth-standby
            docker compose pull app
            GIT_COMMIT='"${{ github.sha }}"' docker compose up -d
            docker compose ps
          '
